- hosts: localhost
  name: Kubernetes Setup - Common
  vars_files:
    - ../ansible-vars.yaml
  vars:
    METRICS_SERVER_NAME: metrics-server
    METRICS_SERVER_NAMESPACE: kube-system
    METRICS_SERVER_CHART_NAME: metrics-server
    METRICS_SERVER_CHART_URL: https://kubernetes-sigs.github.io/metrics-server/
    METRICS_SERVER_CHART_VERSION: 3.12.0
    METRICS_SERVER_CONFIG:
      apiService:
        create: true
      service:
        labels:
          kubernetes.io/cluster-service: "true"
          kubernetes.io/name: "Metrics-server"
      replicas: 3  

  tasks:
  # roles/kubernetes/metrics/metrics-server/tasks/main.yaml
    - name: Deploy metrics-server
      kubernetes.core.helm:
        name: "{{ METRICS_SERVER_NAME }}"
        namespace: "{{ METRICS_SERVER_NAMESPACE }}"
        chart_repo_url: "{{ METRICS_SERVER_CHART_URL }}"
        chart_ref: "{{ METRICS_SERVER_CHART_NAME }}"
        chart_version: "{{ METRICS_SERVER_CHART_VERSION }}"
        values: "{{ METRICS_SERVER_CONFIG }}"
        kubeconfig: "{{ kube_config }}"
        wait: true

  # remove Metrics Server
    # - name: Remove metrics-server
    #   kubernetes.core.helm:
    #     name: "{{ METRICS_SERVER_NAME }}"
    #     namespace: "kube-system"
    #     values: "{{ METRICS_SERVER_CONFIG }}"
    #     kubeconfig: "{{ kube_config }}"
    #     state: absent
    #     wait: true