- hosts: localhost
  name: Kubernetes Setup - Secure Kubernetes Items
  vars_files:
    - ../ansible-vars.yaml
  tasks:
  # roles/kubernetes/misc/tasks/main.yaml
    - name: Secure kube config file
      ansible.builtin.file:
        path: "$HOME/.kube/{{ kubernetes_cluster_name }}-kubeconfig.conf"
        mode: "0600"