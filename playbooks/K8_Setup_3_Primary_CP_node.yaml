- hosts: k8s_control_plane[0]
  gather_facts: yes
  name: Kubernetes Setup - Primary Control Plane Node
  become: true
  become_user: root
  vars_files:
    - ../ansible-vars.yaml

  tasks:
  # roles/kubernetes/vip/primary/tasks/main.yaml
    - name: Create /etc/kubernetes/manifests directory
      ansible.builtin.file:
        path: /etc/kubernetes/manifests
        state: directory
        mode: "0755"

    - name: Pull the kube-vip image [ctr]
      ansible.builtin.shell: |
        ctr image pull ghcr.io/kube-vip/kube-vip:v{{ kubernetes_vip_version }}

    - name: Generate kube-vip manifest using ARP (Layer 2) protocol on kubernetes - containerd
      ansible.builtin.shell: |
        ctr run --rm --net-host ghcr.io/kube-vip/kube-vip:v{{ kubernetes_vip_version }} vip /kube-vip manifest pod \
        --arp \
        --controlplane \
        --services \
        --address {{ kubernetes_vip_ip }} \
        --leaderElection \
        --enableLoadBalancer \
        | tee /etc/kubernetes/manifests/kube-vip.yaml

# sudo ctr run --rm --net-host ghcr.io/kube-vip/kube-vip:v0.8.2 vip /kube-vip manifest pod \
#         --arp \
#         --controlplane \
#         --services \
#         --address 10.0.0.238 \
#         --leaderElection \
#         --enableLoadBalancer \
#     | sudo tee /etc/kubernetes/manifests/kube-vip.yaml

  # roles/kubernetes/control_plane/init/primary/tasks/main.yaml
    - name: Copy cluster config
      ansible.builtin.template:
        src: "./templates/control_plane/{{ item }}.j2"
        dest: "/etc/kubernetes/{{ item }}.yaml"
        mode: "0600"
      with_items:
        - kubeadm-config

