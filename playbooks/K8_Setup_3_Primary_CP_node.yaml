    - name: Setup kubernetes .kube directory
      ansible.builtin.file:
        path: ~/.kube
        state: directory
        mode: "0755"

# mkdir ~/.kube

      # Configure env for root.
    - name: Configure env for root
      ansible.builtin.lineinfile:
        path: $HOME/.bashrc
        line: export KUBECONFIG=/etc/kubernetes/admin.conf

# echo "export KUBECONFIG=/etc/kubernetes/admin.conf" | sudo tee -a ~/.bashrc

    - name: Copy admin.conf file
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: ~/.kube/config
        owner: root
        group: root
        mode: "0600"
        remote_src: true

# sudo cp /etc/kubernetes/admin.conf ~/.kube/config
# sudo chown jumpuser:jumpuser ~/.kube/config 
# sudo chmod 0600 ~/.kube/config 
# # copy kube config to jump box
# scp /home/jumpuser/.kube/config 10.0.0.209:~/sas-viya-4-oss-kubeconfig.conf

    - name: Fetch k8s config
      ansible.builtin.fetch:
        src: /etc/kubernetes/admin.conf
        dest: "{{ inventory_dir }}/{{ kubernetes_cluster_name }}-kubeconfig.conf"
        flat: true
  
  # roles/kubernetes/cni/calico/tasks/main.yaml
    - name: Install Operator
      ansible.builtin.shell: |
        kubectl create -f "https://raw.githubusercontent.com/projectcalico/calico/v{{ kubernetes_cni_version }}/manifests/tigera-operator.yaml"

# sudo bash
# kubectl create -f "https://raw.githubusercontent.com/projectcalico/calico/v3.28.0/manifests/tigera-operator.yaml"

    - name: Create custom-resources for our cluster
      ansible.builtin.template:
        src: "./templates/cni/{{ item }}.tmpl"
        dest: "/tmp/{{ item }}.yaml"
      with_items:
        - custom-resources

