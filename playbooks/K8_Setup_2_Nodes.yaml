---
# All kubernetes nodes
- hosts:  k8s
  name: Kubernetes Setup - Nodes
  become: true
  become_user: root
  vars_files:
    - ../ansible-vars.yaml

  tasks:
  # roles/kubernetes/cri/containerd/tasks/main.yaml

    # Task to Remove existing containerd installations
    - name: Uninstall old Docker/Containerd versions
      ansible.builtin.package:
        name: "{{ packages }}"
        state: absent
      vars:
        packages:
          - docker
          - docker-engine
          - docker.io
          - containerd
          - containerd.io
          - runc
      ignore_errors: true
      # tags:
      #   - install

    # Install required packages for containerd
    - name: Install required packages
      ansible.builtin.package:
        name: "{{ packages }}"
        state: present
      vars:
        packages:
          - apt-transport-https # Also needed for kubeadm tooling
          - ca-certificates     # Also needed for kubeadm tooling
          - curl                # Also needed for kubeadm tooling
          - gnupg2
          - lsb-release
          - software-properties-common
      # tags:
      #   - install
      #   - update

    #
    # containerd - https://kubernetes.io/docs/setup/production-environment/container-runtimes/#containerd
    #
    - name: Add module load file for containerd
      ansible.builtin.copy:
        dest: "/etc/modules-load.d/containerd.conf"
        content: |
          overlay
          br_netfilter
      # tags:
      #   - install
      #   - update

    - name: Add modules to running system for containerd
      ansible.builtin.shell: |
        modprobe overlay
        modprobe br_netfilter
      # tags:
      #   - install
      #   - update

    # NOTE: Added net.ipv4.conf.all.rp_filter for Calico CNI
    - name: IP Table - File Update
      ansible.builtin.copy:
        dest: "/etc/sysctl.d/99-kubernetes-cri.conf"
        content: |
          net.bridge.bridge-nf-call-ip6tables = 1
          net.bridge.bridge-nf-call-iptables  = 1
          net.ipv4.ip_forward                 = 1
          net.ipv4.conf.all.rp_filter         = 1
      # tags:
      #   - install
      #   - update

    - name: IP Table - System Enable
      ansible.builtin.command: /sbin/sysctl --system
      # tags:
      #   - install
      #   - update

    - name: Installing the Docker gpg key for containerd.io
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        keyring: /usr/share/keyrings/docker-archive-keyring.gpg
        state: present
      # tags:
      #   - install
      #   - update

    - name: Adding the Docker repo for containerd.io
      ansible.builtin.apt_repository:
        repo: deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        state: present
      # tags:
      #   - install
      #   - update

    - name: Set containerd.io package debian revision if not specified
      set_fact:
        kubernetes_cri_deb_rev: "-*"
      when:
        - kubernetes_cri_version | regex_search("^(\d+\.)(\d+\.)(\d+)$")
      # tags:
      #   - install
      #   - update

    - name: Installing containerd.io
      ansible.builtin.package:
        name: "{{ packages }}"
        state: present
      vars:
        packages:
          - "containerd.io{% if kubernetes_cri_version is defined and kubernetes_cri_version %}={{ kubernetes_cri_version }}{{ kubernetes_cri_deb_rev }}{%endif %}"
      # tags:
    #   #   - install
    #   #   - update

    - name: Create /etc/containerd directory
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        mode: "0755"
      # tags:
      #   - install
      #   - update

    - name: Create containerd configuration file
      ansible.builtin.shell: |
        containerd config default > /etc/containerd/config.toml
      # tags:
      #   - install
      #   - update

    - name: Enable systemd cgroups for containerd
      ansible.builtin.lineinfile:
        path: /etc/containerd/config.toml
        regexp: '^            SystemdCgroup = false'
        line: '            SystemdCgroup = true'
      # tags:
      #   - install
      #   - update


    - name: Enabling and starting containerd to start now and on boot
      ansible.builtin.systemd:
        name: containerd.service
        enabled: true
        state: restarted
      # tags:
      #   - install
      #   - update
  
  # roles/kubernetes/toolbox/tasks/main.yaml
    - name: Set kubernetes version facts for toolbox installation
      set_fact:
        k8s_version_semantic_parts: "{{ kubernetes_version.split('.') }}"

    - name: Set kubernetes version part facts for toolbox installation
      set_fact:
        k8s_major_version: "{% if k8s_version_semantic_parts|length > 0 %}{{ k8s_version_semantic_parts.0 }}{% endif %}"
        k8s_minor_version: "{% if k8s_version_semantic_parts|length > 1 %}{{ k8s_version_semantic_parts.1 }}{% endif %}"
        k8s_patch_version: "{% if k8s_version_semantic_parts|length > 2 %}{{ k8s_version_semantic_parts.2 }}{% else %}0{% endif %}"

    # Apply Kubernetes public signing key
    - name: Apply Kubernetes public signing key
      ansible.builtin.get_url:
        url: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_major_version }}.{{ k8s_minor_version }}/deb/Release.key"
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc

    # Add Kubernetes apt repository
    - name: Add Kubernetes apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v{{ k8s_major_version }}.{{ k8s_minor_version }}/deb/ /"
        state: present
        update_cache: true

    - name: Generate crictl.yaml file for docker
      ansible.builtin.shell: |
        cat >> /etc/crictl.yaml << EOF
        runtime-endpoint: unix:///var/run/dockershim.sock
        image-endpoint: unix:///var/run/dockershim.sock
        timeout: 10
        debug: false
        EOF

    # Update apt package index and install kubelet, kubeadm, kubectl
    - name: Update apt package index and install kubelet, kubeadm, kubectl
      ansible.builtin.apt:
        pkg:
          - kubelet={{ kubernetes_version }}-{{ kube_deb_rev }}
          - kubeadm={{ kubernetes_version }}-{{ kube_deb_rev }}
          - kubectl={{ kubernetes_version }}-{{ kube_deb_rev }}
        state: present
        update_cache: true

    # Mark the packages to hold as we control the version ;)
    - name: Mark the packages to hold as we control the version ;)
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      with_items:
        - kubelet
        - kubeadm
        - kubectl
