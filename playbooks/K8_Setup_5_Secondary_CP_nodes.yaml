# scp /etc/kubernetes/pki/etcd/ca.key 10.0.0.221:/etc/kubernetes/pki/
# scp /etc/kubernetes/pki/ca.crt 10.0.0.222:/etc/kubernetes/pki/
# scp /etc/kubernetes/pki/ca.key 10.0.0.222:/etc/kubernetes/pki/
# scp /etc/kubernetes/pki/sa.key 10.0.0.222:/etc/kubernetes/pki/
# scp /etc/kubernetes/pki/sa.pub 10.0.0.222:/etc/kubernetes/pki/
# scp /etc/kubernetes/pki/front-proxy-ca.crt 10.0.0.222:/etc/kubernetes/pki/
# scp /etc/kubernetes/pki/front-proxy-ca.key 10.0.0.222:/etc/kubernetes/pki/
