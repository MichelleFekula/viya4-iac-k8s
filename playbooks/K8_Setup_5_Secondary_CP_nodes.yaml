- hosts: k8s_control_plane[1:]
  name: Kubernetes Setup - Secondary Control Plane Nodes
  become: true
  become_user: root
  vars_files:
    - ../ansible-vars.yaml

  tasks:
  # roles/kubernetes/control_plane/init/secondary/tasks/main.yaml
    - name: Create kubernetes /etc/kubernetes/pki directory
      ansible.builtin.file:
        path: /etc/kubernetes/{{ item }}
        state: directory
        mode: "0755"
        owner: root
        group: root
      with_items:
        - pki
        - pki/etcd
    
# ssh 10.0.0.221
# sudo mkdir /etc/kubernetes/pki
# sudo mkdir /etc/kubernetes/pki/etcd
# sudo chown -R jumpuser:sudo /etc/kubernetes/
# exit
# ssh 10.0.0.222
# sudo mkdir /etc/kubernetes/pki
# sudo mkdir /etc/kubernetes/pki/etcd
# sudo chown -R jumpuser:sudo /etc/kubernetes/
# exit

    - name: Copy Kubernetes primary control plane PKI files to secondary control plane k8s_nodes
      ansible.posix.synchronize:
        src: /etc/kubernetes/pki/{{ item }}
        dest: /etc/kubernetes/pki/{{ item }}
      delegate_to: "{{ groups['k8s_control_plane'][0] }}"
      with_items:
        - ca.crt
        - ca.key
        - sa.key
        - sa.pub
        - front-proxy-ca.crt
        - front-proxy-ca.key
        - etcd/ca.crt
        - etcd/ca.key

