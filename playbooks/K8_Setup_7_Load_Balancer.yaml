#   cidr-global: 10.0.0.239-10.0.0.248
# EOF
# sudo chmod 0600 /tmp/kube-vip-cm.yaml

        - name: Apply kube-vip Cloud Provider configMap
          ansible.builtin.shell: |
            kubectl apply -f /tmp/kube-vip-cm.yaml

